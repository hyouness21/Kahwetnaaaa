<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kahwetna - Availability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="logo">KAHWETNA</span>
      <button class="hamburger" id="menuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="availability.html">Availability</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="owners.html">Owners</a></li>
        <li><a href="names.html">Names</a></li>
        <li><a href="shohada.html">Shohada</a></li>
      </ul>
    </nav>
  </header>

  <main class="availability-page">

    <div class="availability-container">

      <!-- Hours Card -->
      <div class="hours-card">
        <h2 class="hours-title">Opening Hours</h2>
        <div class="hours-row">
          <span class="hours-label">Opens</span>
          <span class="hours-value">11:00 AM <span class="hours-note">( لمفروض)</span></span>
        </div>
        <div class="hours-row">
          <span class="hours-label">Closes</span>
          <span class="hours-value">Ekher wahad Bfel</span>
        </div>
      </div>

      <!-- Log Form -->
      <div class="log-card">
        <h2 class="hours-title">Who opened today?</h2>
        <div class="log-form">
          <input type="text" id="openerName" class="opener-input" placeholder="Enter your name..." />
          <button id="logOpenBtn" class="log-btn">Log Opening</button>
        </div>

        <!-- History -->
        <div class="log-history-header">
          <span class="log-history-title">History</span>
          <button class="log-edit-btn" id="logEditBtn">✎ Edit</button>
        </div>
        <div class="log-history" id="logHistory"></div>
      </div>


    </div>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
