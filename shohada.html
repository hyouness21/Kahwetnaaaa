<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kahwetna - Shohada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="logo">KAHWETNA</span>
      <button class="hamburger" id="menuBtn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="availability.html">Availability</a></li>
        <li><a href="games.html">Games</a></li>
        <li><a href="owners.html">Owners</a></li>
        <li><a href="names.html">Names</a></li>
        <li><a href="shohada.html">Shohada</a></li>
      </ul>
    </nav>
  </header>

  <main class="shohada-page">

    <div class="shohada-page-inner">

      <div class="shohada-top-bar">
        <h1 class="shohada-arabic-title">شهداؤنا عظماؤنا</h1>
        <button class="names-edit-btn" id="shohadaEditBtn">✎ Edit</button>
      </div>

      <div class="names-grid" id="shohadaGrid"></div>

    </div>

    <!-- View Popup -->
    <div class="person-overlay" id="shohadaViewOverlay">
      <div class="person-popup">
        <button class="popup-close" id="shohadaViewClose">✕</button>
        <h2 class="person-popup-name" id="shohadaViewName"></h2>
        <div class="shohada-info">
          <div class="shohada-info-row">
            <span class="shohada-info-label">Born</span>
            <span class="shohada-info-value" id="shohadaViewBorn"></span>
          </div>
          <div class="shohada-info-row">
            <span class="shohada-info-label">Martyred</span>
            <span class="shohada-info-value" id="shohadaViewMartyred"></span>
          </div>
        </div>
      </div>
    </div>


    <!-- Edit Popup -->
    <div class="person-overlay" id="shohadaEditOverlay">
      <div class="person-popup">
        <button class="popup-close" id="shohadaEditClose">✕</button>
        <h2 class="person-popup-name" id="shohadaEditTitle">Add Shahid</h2>

        <div class="edit-person-img-wrap">
          <img id="shohadaEditPreview" src="images/logo.jpeg" alt="" />
          <label class="change-photo-btn">
            Change Photo
            <input type="file" id="shohadaEditFile" accept="image/*" style="display:none" />
          </label>
        </div>

        <input type="text" class="password-input" id="shohadaEditName" placeholder="Name" style="margin-top:14px" />
        <input type="text" class="password-input" id="shohadaEditBorn" placeholder="Born (e.g. 01/01/1990)" style="margin-top:10px" />
        <input type="text" class="password-input" id="shohadaEditMartyred" placeholder="Martyred (e.g. 01/01/2024)" style="margin-top:10px" />
        <button class="confirm-btn" id="shohadaEditSave" style="margin-top:12px">Save</button>
      </div>
    </div>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
